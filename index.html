<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алхимия: С визуализацией (240 элементов)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 380px;
            background: #202024;
            border-right: 1px solid #323238;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #00b37e; display: flex; justify-content: space-between; align-items: center; }
        .stats { font-size: 0.8rem; color: #8d8d99; }
        
        .search-box {
            width: 100%;
            padding: 10px;
            background: #121214;
            border: 1px solid #323238;
            border-radius: 8px;
            color: #e1e1e6;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .search-box:focus { border-color: #00b37e; outline: none; }

        .elements-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }
        .element-btn {
            background: #29292e;
            border: 1px solid #323238;
            color: #e1e1e6;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .element-btn:hover {
            background: #323238;
            border-color: #00b37e;
        }
        .main-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
        }
        
        .workspace {
            flex: 1;
            background: #1a1a1e;
            border: 2px dashed #323238;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            position: relative;
            transition: background 0.3s;
        }

        @keyframes successPulse {
            0% { transform: scale(1); border-color: #00b37e; background: #003322; }
            50% { transform: scale(1.02); border-color: #00ffaa; background: #004d33; box-shadow: 0 0 25px rgba(0, 179, 126, 0.4); }
            100% { transform: scale(1); border-color: #323238; background: #1a1a1e; }
        }

        @keyframes failShake {
            0%, 100% { transform: translateX(0); border-color: #f75a68; background: #3d1519; }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .workspace.success { animation: successPulse 0.5s ease; }
        .workspace.fail { animation: failShake 0.4s ease; }

        .slot {
            width: 140px;
            height: 140px;
            background: #25252b;
            border: 2px solid #323238;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            gap: 6px;
        }
        .slot.filled {
            border-color: #00b37e;
            background: #004d33;
        }
        /* Большие иконки-эмодзи внутри слотов */
        .slot-icon {
            font-size: 2.5rem;
            line-height: 1;
        }
        .slot-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        .left-controls, .right-controls {
            display: flex;
            gap: 15px;
        }
        .action-btn {
            background: #00b37e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover { background: #00875f; }
        .action-btn.secondary { background: #29292e; border: 1px solid #323238; }
        .action-btn.secondary:hover { background: #323238; }
        .action-btn.danger { background: #571e22; border: 1px solid #7a282d; }
        .action-btn.danger:hover { background: #7a282d; }
        .message {
            margin-top: 15px;
            height: 24px;
            font-size: 1rem;
            color: #fba94c;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                height: 45vh;
                border-right: none;
                border-bottom: 1px solid #323238;
                padding: 12px;
            }
            .main-field {
                flex: 1;
                height: 55vh;
                padding: 15px;
            }
            .workspace { gap: 15px; }
            .slot {
                width: 105px;
                height: 105px;
            }
            .slot-icon { font-size: 1.8rem; }
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            .left-controls, .right-controls {
                width: 100%;
                justify-content: space-between;
            }
            .action-btn {
                flex: 1;
                padding: 10px;
                text-align: center;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

    let selected1 = null;
    let selected2 = null;

    function loadGame() {
        const saved = localStorage.getItem('alchemy_unlocked');
        if (saved) {
            const unlockedList = JSON.parse(saved);
            unlockedList.forEach(key => {
                if (elements[key]) elements[key].unlocked = true;
            });
        }
    }

    function saveGame() {
        const unlockedList = [];
        for (let key in elements) {
            if (elements[key].unlocked) unlockedList.push(key);
        }
        localStorage.setItem('alchemy_unlocked', JSON.stringify(unlockedList));
    }

    function updateSidebar() {
        const list = document.getElementById('elementsList');
        const filter = document.getElementById('searchBox').value.toLowerCase();
        list.innerHTML = '';
        
        let unlockedCount = 0;
        let totalCount = Object.keys(elements).length;

        for (let key in elements) {
            if (elements[key].unlocked) {
                unlockedCount++;
                if (elements[key].name.toLowerCase().includes(filter)) {
                    const btn = document.createElement('button');
                    btn.className = 'element-btn';
                    // В списке тоже выводим с иконкой для красоты
                    btn.innerText = `${elements[key].icon} ${elements[key].name}`;
                    btn.onclick = () => selectElement(key);
                    list.appendChild(btn);
                }
            }
        }
        document.getElementById('stats').innerText = `${unlockedCount} / ${totalCount}`;
    }

    function filterElements() {
        updateSidebar();
    }

    function selectElement(key) {
        if (!selected1) {
            selected1 = key;
            setSlotContent(1, key);
        } else if (!selected2 && selected1 !== key) {
            selected2 = key;
            setSlotContent(2, key);
        } else {
            selected1 = key;
            selected2 = null;
            setSlotContent(1, key);
            clearSlotUI(2);
        }
        document.getElementById('message').innerText = '';
    }

    function setSlotContent(slotNum, key) {
        const slot = document.getElementById(`slot${slotNum}`);
        const el = elements[key];
        slot.innerHTML = `
            <span class="slot-icon">${el.icon}</span>
            <span class="slot-name">${el.name}</span>
        `;
        slot.classList.add('filled');
    }

    function clearSlotUI(slotNum) {
        const slot = document.getElementById(`slot${slotNum}`);
        slot.innerHTML = `
            <span class="slot-icon">➕</span>
            <span class="slot-name">Пусто</span>
        `;
        slot.classList.remove('filled');
    }

    function clearSlot(slotNum) {
        if (slotNum === 1) selected1 = null;
        else selected2 = null;
        clearSlotUI(slotNum);
    }

    function resetWorkspace() {
        selected1 = null;
        selected2 = null;
        clearSlotUI(1);
        clearSlotUI(2);
        document.getElementById('message').innerText = '';
    }

    function triggerAnimation(isSuccess) {
        const ws = document.getElementById('workspace');
        ws.classList.remove('success', 'fail');
        void ws.offsetWidth; 
        ws.classList.add(isSuccess ? 'success' : 'fail');
    }

    function mixElements() {
        const msg = document.getElementById('message');
        if (!selected1 || !selected2) {
            msg.innerText = 'Выберите два элемента!';
            return;
        }

        const key1 = `${selected1}+${selected2}`;
        const key2 = `${selected2}+${selected1}`;
        let result = recipes[key1] || recipes[key2];

        if (result && elements[result]) {
            triggerAnimation(true);
            
            // КРАСИВОЕ ПОКАЗЫВАНИЕ РЕЗУЛЬТАТА В СЛОТАХ
            setSlotContent(1, selected1);
            setSlotContent(2, result); // Слот 2 превращается в получившийся элемент (например, Пар)

            if (!elements[result].unlocked) {
                elements[result].unlocked = true;
                msg.style.color = '#00b37e';
                msg.innerText = `🎉 Открыт новый элемент: ${elements[result].icon} ${elements[result].name}!`;
                saveGame();
                updateSidebar();
            } else {
                msg.style.color = '#fba94c';
                msg.innerText = `Уже открыт: ${elements[result].icon} ${elements[result].name}`;
            }

            // Оставляем результат во втором слоте, а первый обнуляем для удобства дальнейшей игры
            selected1 = result; 
            selected2 = null;
            setTimeout(() => {
                clearSlotUI(1);
            }, 300);

        } else {
            triggerAnimation(false);
            msg.style.color = '#f75a68';
            msg.innerText = '💥 Не вышло... Попробуй другое.';
            resetWorkspace();
        }
    }

    function resetProgress() {
        if (confirm('Сбросить весь прогресс?')) {
            localStorage.removeItem('alchemy_unlocked');
            for (let key in elements) {
                elements[key].unlocked = ['Вода', 'Огонь', 'Земля', 'Воздух'].includes(key);
            }
            updateSidebar();
            resetWorkspace();
            document.getElementById('message').innerText = 'Прогресс сброшен.';
        }
    }

    loadGame();
    updateSidebar();
